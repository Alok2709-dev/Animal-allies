<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d3423"><title>Join Animal Allies</title><link rel="stylesheet" href="experience.css"></head>
<body><main class="auth-wrap"><section class="auth-card reveal"><a class="brand" href="index.html"><span class="brand-mark">♥</span>ANIMAL ALLIES</a><h1>Join the allies.</h1><p>Save wildlife you care about and become part of the movement for kinder neighbourhoods.</p><form data-demo-form><div class="field"><label for="name">Your name</label><input id="name" name="name" autocomplete="name" required></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Create a password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required></div><button class="btn" type="submit">Become an ally <span>→</span></button><p class="form-note">Account creation needs a connected authentication service before it can go live.</p></form><p class="auth-switch">Already an ally? <a href="Login.html">Log in</a></p></section></main><script src="experience.js"></script></body></html>
